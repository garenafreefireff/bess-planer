name: bess-planner

services:
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: bess-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-bess}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-bess_dev_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-bess_planner}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"${MONGO_INITDB_ROOT_USERNAME:-bess}\" --password \"${MONGO_INITDB_ROOT_PASSWORD:-bess_dev_password}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bess-backend
    restart: unless-stopped
    environment:
      APP_NAME: "BESS Planner API"
      ENVIRONMENT: docker
      APP_DEBUG: "false"
      API_V1_PREFIX: /api/v1
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-bess}:${MONGO_INITDB_ROOT_PASSWORD:-bess_dev_password}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-bess_planner}
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_ID_HEADER: X-Request-ID
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-dev-insecure-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      REFRESH_COOKIE_NAME: bess_refresh_token
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAMESITE: lax
      PASSWORD_HASH_ITERATIONS: ${PASSWORD_HASH_ITERATIONS:-210000}
      STORAGE_DIRECTORY: /app/storage/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_MINUTE: ${RATE_LIMIT_REGISTER_PER_MINUTE:-6}
      RATE_LIMIT_QUICK_SIZING_PER_MINUTE: ${RATE_LIMIT_QUICK_SIZING_PER_MINUTE:-20}
      RATE_LIMIT_LEAD_CAPTURE_PER_MINUTE: ${RATE_LIMIT_LEAD_CAPTURE_PER_MINUTE:-10}
      RATE_LIMIT_SIZING_LAB_PER_MINUTE: ${RATE_LIMIT_SIZING_LAB_PER_MINUTE:-4}
      ANALYSIS_MAX_CONCURRENCY: ${ANALYSIS_MAX_CONCURRENCY:-2}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      NOTIFICATION_OUTBOX_ENABLED: ${NOTIFICATION_OUTBOX_ENABLED:-true}
      SALES_NOTIFICATION_EMAIL: ${SALES_NOTIFICATION_EMAIL:-sales@datainsight.vn}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/storage/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: bess-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongodb_data:
  backend_uploads:
